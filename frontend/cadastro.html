<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biosaka - Criar minha conta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">

  <link rel="stylesheet" href="css/auth.css">
</head>

<body>

  <!-- ========== CABEÇALHO ========== -->
  <header class="cabecalho">

    <a class="logo" href="index.html">
      <span class="logo-icone">🐝</span>
      Biosaka
    </a>

  </header>

  <!-- ========== BOTÃO DE VOLTAR ========== -->
  <div class="voltar-barra">
    <a class="voltar" href="login.html" data-voltar>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4" /><path d="M11 5l-7 7 7 7" /></svg>
      Voltar
    </a>
  </div>


  <main class="auth">

    <!-- ========== FORMULÁRIO DE CRIAÇÃO DE CONTA ========== -->
    <section class="auth-cartao">
      <h1>Criar minha conta</h1>
      <p class="auth-subtitulo">Preencha os dados abaixo para podermos começar</p>

      <form id="form" novalidate>

        <label for="usuario">Nome de usuário</label>
        <input id="usuario" placeholder="Escolha um nome de usuário" autocomplete="username">
        <p class="erro" id="erro-usuario"></p>

        <label for="email">E-mail</label>
        <input id="email" type="text" inputmode="email" placeholder="Seu e-mail" autocomplete="email">
        <p class="erro" id="erro-email"></p>

        <label for="telefone">Telefone</label>
        <input id="telefone" type="tel" placeholder="(11) 91234-5678" autocomplete="tel-national">
        <p class="erro" id="erro-telefone"></p>

        <label for="cidade">Região: cidade</label>
        <input id="cidade" placeholder="Ex.: Campinas" autocomplete="address-level2">
        <p class="erro" id="erro-cidade"></p>

        <label for="estado">Região: estado</label>
        <input id="estado" placeholder="Ex.: São Paulo" autocomplete="address-level1">
        <p class="erro" id="erro-estado"></p>

        <label for="pais">Região: país</label>
        <input id="pais" placeholder="Ex.: Brasil" autocomplete="country-name">
        <p class="erro" id="erro-pais"></p>

        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="Crie uma senha" autocomplete="new-password">
        <p class="erro" id="erro-senha"></p>

        <label for="confirmar">Confirmar senha</label>
        <input id="confirmar" type="password" placeholder="Repita a senha" autocomplete="new-password">
        <p class="erro" id="erro-confirmar"></p>

        <p class="erro erro-geral" id="erro-geral"></p>

        <button class="botao" type="submit">Continuar</button>
      </form>

      <p class="auth-rodape">Já tem uma conta? <a href="login.html">Entrar</a></p>
    </section>

  </main>

  <script src="js/voltar.js"></script>

  <script src="js/auth.js"></script>

  <script src="js/cadastro.js"></script>

</body>

</html>
